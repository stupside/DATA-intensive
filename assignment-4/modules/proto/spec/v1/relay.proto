syntax = "proto3";

package spec.v1;

import "google/api/annotations.proto";

option go_package = "github.com/stupside/DATA-intensive/assignment-4/modules/proto/gen/spec/v1;v1";

// StreamRequest is sent by the producer (client pushing files)
message StreamRequest {
  oneof payload {
    StreamInit init = 1;
    StreamChunk chunk = 2;
  }
}

// StreamInit initializes the stream session
message StreamInit {
  string share_key = 1;
}

// StreamChunk contains file chunk data from producer
message StreamChunk {
  bytes data = 1;
  string path = 2;
  uint64 offset = 3; // Byte offset in the file
  uint64 length = 4; // Number of bytes in this chunk
}

// StreamResponse is sent by the server to the producer
message StreamResponse {
  oneof payload {
    RequestChunk request = 1;
    StreamComplete complete = 2;
  }
}

// RequestChunk asks producer to send next chunk
message RequestChunk {
  string path = 1;
  uint64 offset = 2; // Byte offset in the file
  uint64 length = 3; // Number of bytes to request
}

// StreamComplete indicates all chunks have been sent
message StreamComplete {}

// ConsumeRequest is sent by the consumer (client pulling files)
message ConsumeRequest {
  oneof payload {
    ConsumeInit init = 1;
    ConsumeNext next = 2;
  }
}

// ConsumeInit starts consumption
message ConsumeInit {
  string share_key = 1;
}

// ConsumeNext requests a specific chunk from the producer
message ConsumeNext {
  string path = 1; // File path to request
  uint64 offset = 2; // Byte offset in the file
  uint64 length = 3; // Number of bytes to request
}

// ConsumeResponse is sent by server to consumer
message ConsumeResponse {
  oneof payload {
    ConsumeChunk chunk = 1;
    ConsumeComplete complete = 2;
  }
}

// ConsumeChunk forwards a chunk to the consumer
message ConsumeChunk {
  bytes data = 1;
  string path = 2;
  uint64 offset = 3; // Byte offset in the file
  uint64 length = 4; // Number of bytes in this chunk
}

// ConsumeComplete indicates all chunks delivered
message ConsumeComplete {}

// RelaySummary provides statistics about the relay
message SummaryRequest {
  string share_key = 1;
}

// SummaryResponse contains relay statistics
message SummaryResponse {
  message FileSummary {
    string path = 1;
    uint64 bytes_relayed = 2;
    uint64 bytes_remaining = 3;
  }
  repeated FileSummary files = 1;
}

service RelayService {
  // Stream is used by the producer to push data chunks (bidirectional with backpressure)
  rpc Stream(stream StreamRequest) returns (stream StreamResponse) {
    option (google.api.http) = {post: "/api/v1/relay/stream"};
  }
  // Summary provides relay statistics
  rpc Summary(SummaryRequest) returns (SummaryResponse) {
    option (google.api.http) = {get: "/api/v1/relay/summary"};
  }
  // Consume is used by the consumer to pull data chunks (bidirectional with backpressure)
  rpc Consume(stream ConsumeRequest) returns (stream ConsumeResponse) {
    option (google.api.http) = {post: "/api/v1/relay/consume"};
  }
}
